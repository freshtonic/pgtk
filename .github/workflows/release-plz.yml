name: Release

# Manual only. A merge to main must not open a release PR, so there is no `push` trigger here. Run
# "Release" from the Actions tab and choose:
#   release-pr  opens or updates the PR that bumps the versions and the changelogs
#   release     publishes the crates, pushes the tags and makes the GitHub releases, for a
#               release PR that has merged
#
# Run the Release gate on the commit first (ADR 0011 of pgtk-sql). scripts/release.sh does the same
# release from a local machine, with no release PR.
#
# Required repository configuration:
#   - secret CARGO_REGISTRY_TOKEN: a crates.io token with the scopes publish-new and
#     publish-update
#   - secret RELEASE_PLZ_TOKEN: a fine-grained personal access token with contents:write and
#     pull-requests:write on this repository, so that the release PR starts CI (a PR that
#     GITHUB_TOKEN opens does not)
#   - Settings > Actions > General: allow GitHub Actions to create and approve pull requests
on:
  workflow_dispatch:
    inputs:
      command:
        description: release-plz command to run
        required: true
        type: choice
        options:
          - release-pr
          - release

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: release-plz ${{ inputs.command }}
    runs-on: ubuntu-latest
    steps:
      # The whole history is necessary to calculate the next versions and to release from the last
      # commit of the release PR. The packaged crates need no submodule.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: release-plz/action@v0.5
        with:
          command: ${{ inputs.command }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
