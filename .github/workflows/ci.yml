name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the older run of that pull request. Each other run (a push
# to main, or a run started by hand) has a group of its own commit, so it is not cancelled and each
# merge is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo:
    name: Cargo build and test
    runs-on: ubuntu-latest
    steps:
      # The tests read the PostgreSQL sources and the pinned commits from the vendor/postgres
      # object store, so the submodule needs its full history.
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain || rustup toolchain install
      # The pgtk-sql import checkpoint and its records are not changed.
      - run: packages/pgtk-sql/scripts/tests/verify-import-provenance.sh
      # The oracle crates link the pinned PostgreSQL releases, and the live tests run servers of
      # them (pgtk-test-server). build-pg.sh builds each release once into this cache.
      - run: packages/pgtk-sql/scripts/fetch-postgres-pins
      - run: sudo apt-get update && sudo apt-get install --yes bison flex libxml2-dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pgtk-sql/postgres
          key: postgres-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/pgtk-oracle/pins.tsv', 'packages/pgtk-oracle/scripts/build-pg.sh') }}
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace

  lint:
    name: Cargo fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      # clippy runs the build scripts, so the oracle crates need the PostgreSQL builds.
      - run: packages/pgtk-sql/scripts/fetch-postgres-pins
      - run: sudo apt-get update && sudo apt-get install --yes bison flex libxml2-dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pgtk-sql/postgres
          key: postgres-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/pgtk-oracle/pins.tsv', 'packages/pgtk-oracle/scripts/build-pg.sh') }}
      # One job at a time: two checks of the generated grammar crates at the same time use all of
      # the 8 GB of the runner, and the runner stops.
      - run: cargo clippy --locked --workspace --all-targets -j 1 -- -D warnings
      - run: cargo doc --locked --workspace --no-deps -j 1
        env:
          RUSTDOCFLAGS: -D warnings

  commits:
    name: Conventional commits
    # Only a pull request has a range of new commits. Merge commits are not checked.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-conventional-commits "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

  msrv:
    name: Rust 1.88 (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The published crates declare rust-version = "1.88". rust-toolchain.toml pins a newer
      # toolchain for development, so give the version to each command.
      - run: rustup toolchain install 1.88.0 --profile minimal
      # The version features of pgtk-sql are mutually exclusive, so --all-features is not
      # possible for it. The default version (pg17) with its other features is the check. One job
      # at a time, for the memory of the runner (see the lint job).
      - run: cargo +1.88.0 check --locked -j 1 -p pgtk-sql --lib --features spans,arbitrary
      - run: cargo +1.88.0 check --locked -j 1 -p pgtk-catalog --lib --all-features
      - run: cargo +1.88.0 check --locked -j 1 -p pgtk-analyze --lib

  licenses:
    name: Licences of the published dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deny.toml gives the permitted licences. pgtk-analyze includes pgtk-sql and pgtk-catalog.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: packages/pgtk-catalog/Cargo.toml
          command: check licenses
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: packages/pgtk-analyze/Cargo.toml
          command: check licenses
          arguments: --all-features

  buck2:
    name: Buck2 build and test
    runs-on: ubuntu-latest
    env:
      # tools/buck2 turns on the BuildBuddy remote cache when the key is set. A pull request from
      # a fork gets no secrets, so it builds without the cache.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: facebook/install-dotslash@v2
      # The Buck2 C++ toolchain uses /usr/bin/clang, and the prelude links with lld on Linux.
      - run: sudo apt-get update && sudo apt-get install --yes clang lld
      # One job at a time: Buck2 compiles the large generated grammar crates more than once (for
      # metadata, diagnostics and the rlib), and two such compiles at the same time use all of the
      # 8 GB of the runner. The remote cache supplies most actions after the first run.
      - run: tools/buck2 build -j 1 //...
      - run: tools/buck2 test -j 1 //...

  third-party:
    name: Third-party BUCK and vendor are up to date
    runs-on: ubuntu-latest
    env:
      # Keep the same as the reindeer that generated the committed files.
      REINDEER_REV: ffc8a53bf778283f9e1336b0d36ebf7899db1507
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo install --locked --git https://github.com/facebookincubator/reindeer --rev "$REINDEER_REV" reindeer
      - run: scripts/update-third-party
      - name: Fail if the generated files changed
        run: |
          git add -A
          git diff --cached --exit-code --stat
