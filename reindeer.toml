# Reindeer configuration. Reindeer reads the workspace manifest and the shared root `Cargo.lock`,
# vendors the third-party crates and generates `third-party/rust/BUCK`.
# See docs/adr/0001-dual-buck2-cargo-build.md.

manifest_path = "Cargo.toml"
third_party_dir = "third-party/rust"

# A third-party crate with a build script must have a fixup before it can be buckified.
unresolved_fixup_error = true

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
generated_file_header = """
##
## @generated by reindeer
## Do not edit by hand. Run scripts/update-third-party to regenerate.
##
"""

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[platform.macos-arm64]
target = "aarch64-apple-darwin"
