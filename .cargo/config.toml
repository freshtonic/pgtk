# The global kache rustc-wrapper strips incremental compilation on cache
# misses. This crate compiles ~25MB of generated grammar code, so a cache-miss
# full rebuild costs far more than an incremental rebuild. Disable the wrapper
# for this workspace.
[build]
rustc-wrapper = ""
# Parallel rustc front end (nightly). Measured 2026-09-03 on the pg-sql lib.
rustflags = ["-Z", "threads=8"]
