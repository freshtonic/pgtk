[workspace]
resolver = "3"
members = [
  "packages/*",
  "packages/pgtk-proto/pgtk-proto-burn-in",
  "packages/pgtk-proto/pgtk-proto-fsm",
]
# The cargo-fuzz crate of pgtk-proto builds with nightly (cargo fuzz), and has its own Cargo.lock.
exclude = ["packages/pgtk-proto/fuzz"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/freshtonic/pgtk"

[workspace.dependencies]
arbitrary = "1"
base64 = "0.23.0"
bytes = "1.12.1"
cc = "1"
clap = "4.5"
criterion = "0.8.2"
derive_more = "2.1.1"
futures-util = "0.3"
hmac = "0.13.0"
postgres = "0.19"
postgres-protocol = "0.6.12"
proc-macro2 = "1.0.107"
quote = "1.0.47"
railroad = { version = "0.3.6", default-features = false }
rand = "0.10.2"
rcgen = "0.14.8"
recursa = { version = "0.1.7", default-features = false }
recursa-codegen = { version = "0.1.7", default-features = false }
regex = "1"
rustls = "0.23.43"
serde = "1"
serde_json = "1"
sha2 = "0.11.0"
socket2 = "0.6.1"
sqlparser = "0.52"
stringprep = "0.1.5"
subtle = "2.6.1"
syn = "2"
tempfile = "3"
testcontainers-modules = "0.15.0"
thiserror = "2"
tokio = "1.53.1"
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
tokio-rustls = "0.26.4"
tokio-util = "0.7.19"
trybuild = "1.0.120"
vec1 = "1"
x509-parser = "0.18.1"
zstd = "0.13"

# No debug info in the dev profile. On macOS the default is unpacked split
# debug info, which keeps one object file per codegen unit beside the rlib:
# about 5 GB for each build of the generated pgtk-sql grammar, read by every test
# link. Use `--profile dev-debug` for a build with line tables.
[profile.dev]
debug = 0
split-debuginfo = "off"

[profile.dev-debug]
inherits = "dev"
debug = "line-tables-only"
split-debuginfo = "unpacked"

# recursa-codegen runs a CPU-bound grammar analysis in the build scripts of
# pgtk-sql and pgtk-psql; at the default build-override opt-level of 0 that run
# takes ~54s versus ~7s at 3 (recursa 0.1.2).
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# Bench binaries keep debug symbols so sampling profilers resolve parser
# frames in the pgtk-sql flame harness.
[profile.bench]
debug = true

# The burn-in profiles of pgtk-proto-burn-in (packages/pgtk-proto/BENCHES.md).
[profile.burn-in]
inherits = "release"
debug = 2
lto = "fat"
codegen-units = 1
incremental = false

[profile.burn-in-diagnostic]
inherits = "release"
debug = 2
lto = "off"
codegen-units = 1
incremental = false
