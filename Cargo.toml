[package]
name = "pg-analyze"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "PostgreSQL parse analysis over pg-sql and pg-catalog"
license = "MIT"
publish = false

[dependencies]
pg-sql = { path = "../pg-sql", features = ["spans"] }
pg-catalog = { path = "../pg-catalog" }
thiserror = "2"

[dev-dependencies]
pg-catalog = { path = "../pg-catalog", features = ["fixture", "postgres"] }
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
