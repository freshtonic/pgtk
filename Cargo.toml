[package]
name = "pg-sql"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "PostgreSQL SQL parser built with recursa"
license = "MIT"
publish = false

[workspace]
resolver = "3"
members = ["pg-oracle", "migration-tool"]
default-members = ["pg-oracle", "migration-tool"]

[features]
arbitrary = ["dep:arbitrary", "recursa/arbitrary"]
postgres-oracle = ["dep:pg-oracle"]

[dependencies]
clap = { version = "4", features = ["derive"] }
recursa = { path = "../recursa/recursa", features = ["diagrams"] }
logos = "0.16"
regex = "1"
derive_more = { version = "2.1.1", features = ["deref"] }
arbitrary = { version = "1", features = ["derive"], optional = true }
vec1 = "1"
pg-oracle = { path = "pg-oracle", optional = true }

[dev-dependencies]
sqlparser = "0.52"
tempfile = "3"
serde_json = "1"
syn = { version = "2", features = ["full"] }

[[bin]]
name = "gen-stress"
path = "src/bin/gen_stress.rs"

[[bench]]
name = "parse"
harness = false
required-features = ["postgres-oracle"]

[[test]]
name = "differential"
path = "tests/differential.rs"
required-features = ["postgres-oracle"]

[[test]]
name = "accepted_legacy_gaps"
path = "tests/accepted_legacy_gaps.rs"
required-features = ["postgres-oracle"]

[package.metadata.recursa.ast]
derives = ["Debug", "Clone", "FormatTokens", "Visit", "Transform"]
arbitrary_feature = "arbitrary"
railroad = true
parser_rules = "SqlRules"

[build-dependencies]
recursa-codegen = { path = "../recursa/recursa-codegen", features = ["diagrams"] }
