[package]
name = "pg-sql"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "PostgreSQL SQL parser built with recursa"
license = "MIT"
publish = false

[workspace]
resolver = "3"
members = ["pg-oracle", "migration-tool", "pg-psql"]

# recursa-codegen runs a CPU-bound grammar analysis in the build script; at the
# default build-override opt-level of 0 that run takes ~84s versus ~14s at 3.
[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 3

# Release builds use the same generator. Cargo otherwise compiles build
# dependencies at opt-level 0, making a forced LR generation dominate the
# edit/build loop even though the generated crate itself now compiles quickly.
[profile.release.build-override]
opt-level = 3

# The library carries no unit tests and no doctests: the embedded test bodies
# compile as the `embedded` integration target, so `cargo test` builds the
# generated crate once and skips the rustdoc pass over it.
[lib]
test = false
doctest = false

[features]
# Target version (ADR 0009). Enable exactly one version feature; the build
# script stops a build with zero or with two or more. A crate between a
# consumer and pg-sql uses `default-features = false` on pg-sql and forwards
# these features. `postgres-oracle` builds the oracle of the same version.
default = ["pg17"]
pg14 = ["pg-oracle?/pg14"]
pg15 = ["since-pg15", "pg-oracle?/pg15"]
pg16 = ["since-pg15", "since-pg16", "pg-oracle?/pg16"]
pg17 = ["since-pg15", "since-pg16", "since-pg17", "pg-oracle?/pg17"]
pg18 = ["since-pg15", "since-pg16", "since-pg17", "since-pg18", "pg-oracle?/pg18"]
pg19-beta = [
    "since-pg15",
    "since-pg16",
    "since-pg17",
    "since-pg18",
    "since-pg19",
    "pg-oracle?/pg19-beta",
]
# Cumulative helpers for version gates: "added in N" is
# `feature = "since-pgN"`, "removed in N" is `not(feature = "since-pgN")`.
# Only the version features enable them.
since-pg15 = []
since-pg16 = []
since-pg17 = []
since-pg18 = []
since-pg19 = []
arbitrary = ["dep:arbitrary", "recursa/arbitrary"]
postgres-oracle = ["dep:pg-oracle"]
spans = ["recursa/spans", "recursa-codegen/spans"]

[dependencies]
clap = { version = "4", features = ["derive"] }
recursa = { path = "../recursa/recursa", default-features = false, features = ["diagrams", "explorer"] }
regex = "1"
derive_more = { version = "2.1.1", features = ["deref"] }
arbitrary = { version = "1", features = ["derive"], optional = true }
vec1 = "1"
pg-oracle = { path = "pg-oracle", optional = true, default-features = false }

[dev-dependencies]
sqlparser = "0.52"
tempfile = "3"
serde_json = "1"
syn = { version = "2", features = ["full"] }
recursa-explorer = { path = "../recursa/recursa-explorer" }

[[bin]]
name = "gen-stress"
path = "src/bin/gen_stress.rs"

[[bench]]
name = "parse"
harness = false
required-features = ["postgres-oracle"]

# The flame harness (performance-parity Track T, ADR 0006): profiler-friendly
# parse loops over the canonical workloads. See docs/notes/perf.md.
[[bench]]
name = "flame"
harness = false

# Bench binaries keep debug symbols so sampling profilers resolve parser
# frames in the flame harness.
[profile.bench]
debug = true

[[test]]
name = "differential"
path = "tests/differential.rs"
required-features = ["postgres-oracle"]

[[test]]
name = "accepted_legacy_gaps"
path = "tests/accepted_legacy_gaps.rs"
required-features = ["postgres-oracle"]

[[test]]
name = "table_parser"
path = "tests/table_parser.rs"

[build-dependencies]
recursa-codegen = { path = "../recursa/recursa-codegen", default-features = false, features = ["diagrams", "explorer"] }
