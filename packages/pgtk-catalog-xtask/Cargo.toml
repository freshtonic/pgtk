[package]
name = "pgtk-catalog-xtask"
version = "0.0.0"
edition = "2024"
readme = "README.md"
publish = false

[dependencies]
pgtk-catalog = { path = "../pgtk-catalog", features = ["serde", "postgres"] }
postgres.workspace = true
serde_json.workspace = true
zstd.workspace = true

[features]
# Load a PostgreSQL 19 server, to write its fixture.
pg19-beta = ["pgtk-catalog/pg19-beta"]
