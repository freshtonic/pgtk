[package]
name = "pgtk-sql"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A PostgreSQL SQL parser that accepts and rejects exactly what PostgreSQL 14 to 19 beta do"
license = "MIT"
repository.workspace = true
keywords = ["postgresql", "postgres", "sql", "parser", "ast"]
categories = ["parser-implementations", "database"]
readme = "README.md"
publish = true

# The library carries no unit tests: the embedded test bodies compile as the
# `embedded` integration target, so `cargo test` builds the generated crate
# once. The doctests are the examples of README.md.
[lib]
test = false

# docs.rs builds the default version (pg17). `spans` adds the document interface.
[package.metadata.docs.rs]
features = ["spans"]

[features]
# Target version (ADR 0009). Enable exactly one version feature; the build
# script stops a build with zero or with two or more. A crate between a
# consumer and pgtk-sql uses `default-features = false` on pgtk-sql and forwards
# these features. `postgres-oracle` builds the oracle of the same version.
default = ["pg17"]
pg14 = ["pgtk-oracle/pg14"]
pg15 = ["since-pg15", "pgtk-oracle/pg15"]
pg16 = ["since-pg15", "since-pg16", "pgtk-oracle/pg16"]
pg17 = ["since-pg15", "since-pg16", "since-pg17", "pgtk-oracle/pg17"]
pg18 = ["since-pg15", "since-pg16", "since-pg17", "since-pg18", "pgtk-oracle/pg18"]
pg19-beta = [
    "since-pg15",
    "since-pg16",
    "since-pg17",
    "since-pg18",
    "since-pg19",
    "pgtk-oracle/pg19-beta",
]
# Cumulative helpers for version gates: "added in N" is
# `feature = "since-pgN"`, "removed in N" is `not(feature = "since-pgN")`.
# Only the version features enable them.
since-pg15 = []
since-pg16 = []
since-pg17 = []
since-pg18 = []
since-pg19 = []
arbitrary = ["dep:arbitrary", "recursa/arbitrary"]
postgres-oracle = ["pgtk-oracle/parser"]
spans = ["recursa/spans", "recursa-codegen/spans"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
recursa = { workspace = true, features = ["diagrams", "explorer"] }
regex.workspace = true
derive_more = { workspace = true, features = ["deref"] }
arbitrary = { workspace = true, features = ["derive"], optional = true }
vec1.workspace = true

[dev-dependencies]
# The oracle is a dev-dependency, so a published pgtk-sql does not need it. The version features
# select its release, and `postgres-oracle` turns on its parser.
pgtk-oracle = { path = "../pgtk-oracle", default-features = false }
sqlparser.workspace = true
tempfile.workspace = true
serde_json.workspace = true
syn = { workspace = true, features = ["full"] }

[[bin]]
name = "gen-stress"
path = "src/bin/gen_stress.rs"

# The examples. Each one that uses the `document` module needs `spans`. CI builds them with
# `cargo build --workspace --examples`.
[[example]]
name = "parse"
required-features = ["spans"]

[[example]]
name = "version_check"
required-features = ["spans"]

[[example]]
name = "migration_lint"
required-features = ["spans"]

[[bench]]
name = "parse"
harness = false
required-features = ["postgres-oracle"]

# The flame harness (performance-parity Track T, ADR 0006): profiler-friendly
# parse loops over the canonical workloads. See docs/notes/perf.md.
[[bench]]
name = "flame"
harness = false

[[test]]
name = "differential"
path = "tests/differential.rs"
required-features = ["postgres-oracle"]

[[test]]
name = "accepted_legacy_gaps"
path = "tests/accepted_legacy_gaps.rs"
required-features = ["postgres-oracle"]

[[test]]
name = "table_parser"
path = "tests/table_parser.rs"

[build-dependencies]
recursa-codegen = { workspace = true, features = ["diagrams", "explorer"] }
