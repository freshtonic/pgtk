[package]
name = "pg-analyze"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "PostgreSQL parse analysis over pg-sql and pg-catalog"
license = "MIT"
publish = false

[features]
# Grammar Version (ADR 0005). Enable exactly one version feature; pg-sql stops
# a build with zero or with two or more. A crate between a consumer and
# pg-analyze uses `default-features = false` on pg-analyze and forwards these
# features. The Target Version is chosen at run time in the Settings.
default = ["pg17"]
pg14 = ["pg-sql/pg14", "pg-psql/pg14"]
pg15 = ["pg-sql/pg15", "pg-psql/pg15", "since-pg15"]
pg16 = ["pg-sql/pg16", "pg-psql/pg16", "since-pg15", "since-pg16"]
pg17 = ["pg-sql/pg17", "pg-psql/pg17", "since-pg15", "since-pg16", "since-pg17"]
pg18 = [
    "pg-sql/pg18",
    "pg-psql/pg18",
    "since-pg15",
    "since-pg16",
    "since-pg17",
    "since-pg18",
]
pg19-beta = [
    "pg-sql/pg19-beta",
    "pg-psql/pg19-beta",
    "since-pg15",
    "since-pg16",
    "since-pg17",
    "since-pg18",
    "since-pg19",
]
# Cumulative helpers for gates on the AST shape of the Grammar Version: "added
# in N" is `feature = "since-pgN"`, "removed in N" is
# `not(feature = "since-pgN")`. Only the version features enable them.
since-pg15 = []
since-pg16 = []
since-pg17 = []
since-pg18 = []
since-pg19 = []

[dependencies]
pg-sql = { path = "../pg-sql", default-features = false, features = ["spans"] }
pg-catalog = { path = "../pg-catalog" }
recursa = { path = "../recursa/recursa", default-features = false }
thiserror = "2"

[dev-dependencies]
pg-catalog = { path = "../pg-catalog", features = ["fixture", "postgres"] }
pg-psql = { path = "../pg-sql/pg-psql", default-features = false }
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
