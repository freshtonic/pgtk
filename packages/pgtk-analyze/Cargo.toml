[package]
name = "pgtk-analyze"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "PostgreSQL parse analysis over pgtk-sql and pgtk-catalog"
license = "MIT"
repository.workspace = true
publish = true

[features]
# Grammar Version (ADR 0005). Enable exactly one version feature; pgtk-sql stops
# a build with zero or with two or more. A crate between a consumer and
# pgtk-analyze uses `default-features = false` on pgtk-analyze and forwards these
# features. The Target Version is chosen at run time in the Settings.
default = ["pg17"]
pg14 = ["pgtk-sql/pg14", "pgtk-psql/pg14"]
pg15 = ["pgtk-sql/pg15", "pgtk-psql/pg15", "since-pg15"]
pg16 = ["pgtk-sql/pg16", "pgtk-psql/pg16", "since-pg15", "since-pg16"]
pg17 = ["pgtk-sql/pg17", "pgtk-psql/pg17", "since-pg15", "since-pg16", "since-pg17"]
pg18 = [
    "pgtk-sql/pg18",
    "pgtk-psql/pg18",
    "since-pg15",
    "since-pg16",
    "since-pg17",
    "since-pg18",
]
pg19-beta = [
    "pgtk-sql/pg19-beta",
    "pgtk-psql/pg19-beta",
    "since-pg15",
    "since-pg16",
    "since-pg17",
    "since-pg18",
    "since-pg19",
]
# Cumulative helpers for gates on the AST shape of the Grammar Version: "added
# in N" is `feature = "since-pgN"`, "removed in N" is
# `not(feature = "since-pgN")`. Only the version features enable them.
since-pg15 = []
since-pg16 = []
since-pg17 = []
since-pg18 = []
since-pg19 = []

[dependencies]
pgtk-sql = { version = "0.1.0", path = "../pgtk-sql", default-features = false, features = ["spans"] }
pgtk-catalog = { version = "0.1.0", path = "../pgtk-catalog" }
recursa.workspace = true
thiserror.workspace = true

[dev-dependencies]
pgtk-catalog = { path = "../pgtk-catalog", features = ["fixture", "postgres"] }
pgtk-psql = { path = "../pgtk-psql", default-features = false }
pgtk-test-server = { path = "../pgtk-test-server" }
postgres.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
