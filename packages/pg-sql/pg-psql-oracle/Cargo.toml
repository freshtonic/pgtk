[package]
name = "pg-psql-oracle"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "FFI oracle for psql's own client lexer, built from the pinned PostgreSQL release of the target version"
publish = false

[features]
# Target version (ADR 0009): the oracle builds the pinned PostgreSQL release
# of the selected version. The pin table is `pg-oracle/pins.tsv`, which is the
# one pin table of the repository; this crate reads it rather than repeating
# it. Enable exactly one version feature.
default = ["pg17"]
pg14 = []
pg15 = ["since-pg15"]
pg16 = ["since-pg15", "since-pg16"]
pg17 = ["since-pg15", "since-pg16", "since-pg17"]
pg18 = ["since-pg15", "since-pg16", "since-pg17", "since-pg18"]
pg19-beta = ["since-pg15", "since-pg16", "since-pg17", "since-pg18", "since-pg19"]
since-pg15 = []
since-pg16 = []
since-pg17 = []
since-pg18 = []
since-pg19 = []

[lib]
doctest = false

[build-dependencies]
cc = "1"
